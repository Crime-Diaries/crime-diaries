# Rebuilds data/library.js from Wikidata every night and commits it if anything changed.
# This keeps the library fresh with no server: GitHub runs the script, GitHub Pages serves the result.
name: Refresh library

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  workflow_dispatch: {}  # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # the category crawl takes 25 to 50 minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-library.mjs
      - name: Commit if changed
        run: |
          # the date sits on its own line; ignore it so a commit only happens when the cases changed
          if git diff --quiet -I '^window\.LIBRARY_UPDATED' -- data/library.js data/sensitive.js; then
            echo "No change in the library."; exit 0
          fi
          git config user.name "library-bot"
          git config user.email "library-bot@users.noreply.github.com"
          git add data/library.js data/sensitive.js
          git commit -m "Refresh library from Wikidata"
          git push
